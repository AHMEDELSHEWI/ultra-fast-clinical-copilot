name: V1.0.8 repository integrity

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v1.0.8.html'
      - 'v1.0.8-rapid-loader.js'
      - 'v1.0.8-rapid-payload-*.b64'
      - '.github/workflows/v108-repository-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v108:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed V1.0.8 files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v108-files.sha256 <<'EOF'
          e8a0f74e636d74842a3108c057a427c22ee475e9b8e18ba6a9a9cb4f310d6d4e  v1.0.8-rapid-payload-00.b64
          74a6df7e0b82f0f31cd8fcda05e4e2d4b4daa4dae945f310b595d60246105272  v1.0.8-rapid-payload-01.b64
          229589ba2d99640dde07ac4871fa314fb75eff2017378db502dd5cc38f838d3a  v1.0.8-rapid-payload-02.b64
          5125529d0ec69692eaddeb79179900502277079da20b0a837be6f6f7532ff2d6  v1.0.8-rapid-payload-03.b64
          f2993e0885f7e4d326c4e55a610393d703979687013cbf1d0cc53c10938dcc27  v1.0.8-rapid-payload-04.b64
          dba8bff6cac2c9e875450bc3f0bd92234c7970cdef424612a10e6b0b8d6100ac  v1.0.8-rapid-payload-05.b64
          593a7405b1d2b5e6f9b0e8dcf9ee07ed08b11111b646249f4cf3f73a55858ef6  v1.0.8-rapid-payload-06.b64
          633195bd27dad6179e9e924507bc7cfc4e71ead03b08d3b6ff8fcfea1d87170e  v1.0.8-rapid-loader.js
          2c6226d91d7fb4c920c7ffb7216a6ec139c7472b2aad3e8417f1f0bb4fd7ae99  v1.0.8.html
          EOF
          sha256sum -c /tmp/v108-files.sha256

      - name: Reassemble, verify and syntax-check rapid UX
        shell: bash
        run: |
          set -euo pipefail
          cat v1.0.8-rapid-payload-{00..06}.b64 > /tmp/v108-payload.b64
          base64 --decode /tmp/v108-payload.b64 > /tmp/v108-payload.gz
          gzip --decompress --stdout /tmp/v108-payload.gz > /tmp/v1.0.8-rapid-ux.js
          echo '471ee2cd01cece55a023bd44c8373c01f1f85161082a41768072075af1c1adb3  /tmp/v1.0.8-rapid-ux.js' | sha256sum -c -
          node --check /tmp/v1.0.8-rapid-ux.js
          node --check v1.0.8-rapid-loader.js

      - name: Verify entry points
        shell: bash
        run: |
          set -euo pipefail
          grep -q "V1.0.8" v1.0.8.html
          grep -q "v1.0.8-rapid-loader.js" v1.0.8.html
          grep -q "v1.0.8.html" index.html
          grep -q "procedureStatus" v1.0.8.html
