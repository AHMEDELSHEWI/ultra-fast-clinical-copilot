name: V1.0.13 candidate validation

on:
  push:
    branches: ['release/v1.0.13']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1013-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve candidate source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.13-source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 30
      - name: Build from preserved baseline
        run: node scripts/build-v1.0.13.cjs
      - name: Run candidate regression tests
        run: node --test tests/v1.0.13*.test.cjs
      - name: Archive tested candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.13-tested-candidate
          path: dist/v1.0.13/
          if-no-files-found: error
          retention-days: 30
